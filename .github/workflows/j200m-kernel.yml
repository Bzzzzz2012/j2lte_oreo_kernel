
name: J200M Oreo - Binder V3 Experimental

on:
  push:
    paths:
      - ".github/workflows/j200m-kernel.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar kernel base
        uses: actions/checkout@v4
        with:
          repository: KarlosComK/android_kernel_samsung_exynos3475
          ref: cm-14.1
          path: kernel

      - name: Descargar kernel donante
        uses: actions/checkout@v4
        with:
          repository: Exynos3475/android_kernel_samsung_exynos3475
          ref: lineage-17.1
          path: donor

      - name: Descargar compilador ARM
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
          ref: lineage-19.1
          path: gcc

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bc bison flex libssl-dev libelf-dev

      - name: Integrar archivos Binder
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re

          src = Path("donor/drivers/staging/android")
          dst = Path("kernel/drivers/staging/android")

          for name in [
              "binder.c",
              "binder.h",
              "binder_alloc.c",
              "binder_alloc.h",
              "binder_trace.h",
          ]:
              shutil.copy2(src / name, dst / name)
              print("COPIADO:", name)

          makefile = dst / "Makefile"
          data = makefile.read_text()

          pattern = (
              r"(?m)^(obj-\$\(CONFIG_ANDROID_BINDER_IPC\)"
              r"\s*\+=\s*)binder\.o\s*$"
          )

          data, count = re.subn(
              pattern,
              lambda m: m.group(1) +
                        "binder.o binder_alloc.o",
              data,
          )

          if count != 1:
              raise RuntimeError("Error en Makefile Binder")

          makefile.write_text(data)

          kconfig = dst / "Kconfig"
          config = kconfig.read_text()
          source = (src / "Kconfig").read_text()

          for symbol in (
              "ANDROID_BINDER_DEVICES",
              "ANDROID_BINDER_IPC_32BIT",
          ):
              if re.search(
                  rf"(?m)^config {symbol}\b",
                  config
              ):
                  continue

              match = re.search(
                  rf"(?ms)^config {symbol}\b.*?"
                  r"(?=^(?:config|menuconfig|"
                  r"comment|choice|endmenu|if)\b|\Z)",
                  source,
              )

              if not match:
                  raise RuntimeError(
                      f"No se encontro {symbol}"
                  )

              config += "\n" + match.group(0).rstrip()
              config += "\n"

          kconfig.write_text(config)
          PY

      - name: Adaptar prioridades de Binder a Linux 3.10
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          folder = Path(
              "kernel/drivers/staging/android"
          )

          header = folder / "binder_prio_compat.h"

          header.write_text("""
          #ifndef BINDER_PRIO_COMPAT_H
          #define BINDER_PRIO_COMPAT_H

          #include <linux/sched.h>

          #ifndef DEFAULT_PRIO
          #error "DEFAULT_PRIO no definido"
          #endif

          #define BINDER_COMPAT_MIN_NICE (-20)
          #define BINDER_COMPAT_MAX_NICE 19

          #define binder_compat_prio_to_nice(p) \\
              ((p) - DEFAULT_PRIO)

          #define binder_compat_nice_to_prio(n) \\
              ((n) + DEFAULT_PRIO)

          static inline long binder_compat_rlimit_to_nice(
              long limit)
          {
              return BINDER_COMPAT_MAX_NICE - limit + 1;
          }

          #endif
          """)

          binder = folder / "binder.c"
          source = binder.read_text()

          anchor = '#include "binder_alloc.h"'

          if source.count(anchor) != 1:
              raise RuntimeError(
                  "No se encontro el include de binder_alloc"
              )

          source = source.replace(
              anchor,
              anchor + '\n#include "binder_prio_compat.h"'
          )

          replacements = {
              "PRIO_TO_NICE(":
                  "binder_compat_prio_to_nice(",
              "NICE_TO_PRIO(":
                  "binder_compat_nice_to_prio(",
              "rlimit_to_nice(":
                  "binder_compat_rlimit_to_nice(",
              "MIN_NICE":
                  "BINDER_COMPAT_MIN_NICE",
              "MAX_NICE":
                  "BINDER_COMPAT_MAX_NICE",
          }

          for old, new in replacements.items():
              count = source.count(old)

              if count == 0:
                  raise RuntimeError(
                      f"No se encontro: {old}"
                  )

              source = source.replace(old, new)
              print(f"ADAPTADO {old}: {count}")

          binder.write_text(source)
          print("COMPATIBILIDAD DE PRIORIDADES APLICADA")
          PY

      - name: Configurar kernel Oreo
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc/bin/arm-linux-androideabi-"

          mkdir -p out

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            HOSTCFLAGS="-O2 -fcommon" \
            lineage-j2lte_defconfig

          kernel/scripts/config --file out/.config \
            --enable ANDROID_BINDER_IPC \
            --enable ANDROID_BINDER_IPC_32BIT \
            --set-str ANDROID_BINDER_DEVICES \
              "binder,hwbinder,vndbinder"

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            HOSTCFLAGS="-O2 -fcommon" \
            olddefconfig

          grep -Fx \
            'CONFIG_ANDROID_BINDER_IPC_32BIT=y' \
            out/.config

          grep -Fx \
            'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' \
            out/.config

      - name: Compilar Binder V3
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc/bin/arm-linux-androideabi-"

          if make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            HOSTCFLAGS="-O2 -fcommon" \
            -j2 zImage > build.log 2>&1
          then
            test -s out/arch/arm/boot/zImage
            echo "KERNEL COMPILADO"
            tail -n 20 build.log
          else
            echo "ERRORES:"
            grep -nE \
              'error:|fatal error:|undefined reference|Error [0-9]' \
              build.log | head -n 40 || true

            echo "FINAL DEL LOG:"
            tail -n 40 build.log
            exit 1
          fi

      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J200M-Binder-V3-LOG
          path: |
            build.log
            out/.config
          include-hidden-files: true
          if-no-files-found: warn

      - name: Guardar kernel experimental
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: J200M-Binder-V3-KERNEL
          path: out/arch/arm/boot/zImage
          if-no-files-found: error
