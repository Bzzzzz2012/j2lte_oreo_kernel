
name: J200M Oreo - Auditoria Binder

on:
  push:
    paths:
      - ".github/workflows/j200m-kernel.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar kernel base
        uses: actions/checkout@v4
        with:
          repository: KarlosComK/android_kernel_samsung_exynos3475
          ref: cm-14.1
          path: kernel

      - name: Descargar kernel donante
        uses: actions/checkout@v4
        with:
          repository: Exynos3475/android_kernel_samsung_exynos3475
          ref: lineage-17.1
          path: donor

      - name: Analizar compatibilidad Binder
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > binder-audit.txt
          from pathlib import Path
          import subprocess

          symbols = [
              "BC_REPLY_SG",
              "binder_uintptr_t",
              "binder_size_t",
              "BINDER_TYPE_PTR",
              "FLAT_BINDER_FLAG_INHERIT_RT",
              "ANDROID_BINDER_DEVICES",
          ]

          for name in ("kernel", "donor"):
              root = Path(name)
              print("=" * 55)
              print("REPOSITORIO:", name)
              print("=" * 55)

              commit = subprocess.check_output(
                  ["git", "-C", name, "rev-parse", "HEAD"],
                  text=True
              ).strip()
              print("Commit:", commit)

              binder = root / "drivers/staging/android/binder.c"
              if binder.exists():
                  content = binder.read_text(errors="replace")
                  print("\nINCLUDES DE BINDER.C:")
                  for line in content.splitlines():
                      if line.startswith("#include"):
                          print(" ", line)
                  print("\nSIMBOLOS EN BINDER.C:")
                  for symbol in symbols:
                      print(symbol, "=", symbol in content)
              else:
                  print("No existe binder.c en la ruta esperada")

              print("\nCABECERAS BINDER:")
              tracked = subprocess.check_output(
                  ["git", "-C", name, "ls-files"],
                  text=True
              ).splitlines()

              headers = [
                  p for p in tracked
                  if p.endswith(".h")
                  and "binder" in Path(p).name.lower()
              ]

              for rel in headers:
                  path = root / rel
                  data = path.read_text(errors="replace")
                  print("\n", rel)
                  for symbol in symbols:
                      if symbol in data:
                          print("  CONTIENE:", symbol)

              for rel in (
                  "drivers/staging/android/Makefile",
                  "drivers/staging/android/Kconfig",
                  "arch/arm/configs/lineage-j2lte_defconfig",
              ):
                  path = root / rel
                  if not path.exists():
                      continue

                  print("\nARCHIVO:", rel)
                  for num, line in enumerate(
                      path.read_text(
                          errors="replace"
                      ).splitlines(), 1
                  ):
                      if "BINDER" in line or "binder" in line:
                          print(f"{num}: {line}")

              print()

          print("AUDITORIA TERMINADA")
          PY

          cat binder-audit.txt

      - name: Guardar informe
        uses: actions/upload-artifact@v4
        with:
          name: J200M-BINDER-AUDITORIA
          path: binder-audit.txt
          if-no-files-found: error

